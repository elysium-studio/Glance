name: Publish modules

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      modules:
        description: Comma-separated module package IDs
        required: false
        type: string
      all:
        description: Publish every module
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  packages: read

concurrency:
  group: module-feed-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build and publish module feed
    runs-on: windows-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: true
      GLANCE_SFTP_HOST: ${{ secrets.GLANCE_SFTP_HOST }}
      GLANCE_SFTP_USER: ${{ secrets.GLANCE_SFTP_USER }}
      GLANCE_SFTP_PASSWORD: ${{ secrets.GLANCE_SFTP_PASSWORD }}
      GLANCE_SFTP_BASE_PATH: ${{ secrets.GLANCE_SFTP_BASE_PATH }}
      GLANCE_SFTP_HOST_KEY: ${{ secrets.GLANCE_SFTP_HOST_KEY }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 11.0.100-preview.6.26359.118

      - name: Configure private Elysium feed
        shell: pwsh
        env:
          ELYSIUM_PACKAGES_TOKEN: ${{ secrets.ELYSIUM_PACKAGES_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $token = if ([string]::IsNullOrWhiteSpace($env:ELYSIUM_PACKAGES_TOKEN)) { $env:GITHUB_TOKEN } else { $env:ELYSIUM_PACKAGES_TOKEN }
          dotnet nuget update source "Elysium Studio" --username $env:GITHUB_REPOSITORY_OWNER --password $token --store-password-in-clear-text --configfile NuGet.config

      - name: Install WinSCP
        shell: pwsh
        run: choco install winscp --no-progress --yes

      - name: Publish selected modules
        shell: pwsh
        run: |
          $arguments = @{}

          if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
            if ('${{ inputs.all }}' -eq 'true') {
              $arguments.All = $true
            }
            elseif (-not [string]::IsNullOrWhiteSpace('${{ inputs.modules }}')) {
              $arguments.Module = '${{ inputs.modules }}'.Split(',', [StringSplitOptions]::RemoveEmptyEntries).Trim()
            }
            else {
              throw 'Choose at least one module or select all modules.'
            }
          }
          else {
            $arguments.ChangedSince = '${{ github.event.before }}'
          }

          ./publish-modules.ps1 @arguments

      - name: Upload generated feed
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: module-feed
          path: artifacts/module-feed
          if-no-files-found: ignore
