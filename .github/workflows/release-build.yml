name: Release build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    name: WinUI managed publish (x64)
    runs-on: windows-latest

    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: true

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 11.0.100-preview.6.26359.118

      - name: Configure private Elysium feed
        shell: pwsh
        env:
          ELYSIUM_PACKAGES_TOKEN: ${{ secrets.ELYSIUM_PACKAGES_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $token = if ([string]::IsNullOrWhiteSpace($env:ELYSIUM_PACKAGES_TOKEN)) {
            $env:GITHUB_TOKEN
          }
          else {
            $env:ELYSIUM_PACKAGES_TOKEN
          }

          dotnet nuget update source "Elysium Studio" `
            --username $env:GITHUB_REPOSITORY_OWNER `
            --password $token `
            --store-password-in-clear-text `
            --configfile NuGet.config

      - name: Publish application
        shell: pwsh
        run: |
          dotnet publish Glance.Shell.WinUI/Glance.Shell.WinUI.csproj `
            --configuration Release `
            --runtime win-x64 `
            --output artifacts/release `
            --self-contained true `
            --property:Platform=x64 `
            --property:PublishAot=false `
            --property:PublishTrimmed=false `
            --property:DebugType=None `
            --property:DebugSymbols=false `
            --property:StripSymbols=true `
            --warnaserror

      - name: Verify release output
        shell: pwsh
        run: |
          $requiredFiles = @(
            "artifacts/release/Glance.exe",
            "artifacts/release/Glance.dll",
            "artifacts/release/Glance.pri",
            "artifacts/release/Glance.UI.WinUI.dll",
            "artifacts/release/Glance.UI.WinUI.pri",
            "artifacts/release/App.xbf",
            "artifacts/release/Microsoft.WindowsAppRuntime.Insights.Resource.dll"
          )

          foreach ($requiredFile in $requiredFiles) {
            if (-not (Test-Path -LiteralPath $requiredFile -PathType Leaf)) {
              throw "Managed publish did not produce $requiredFile"
            }
          }

          $requiredModules = @(
            "AudioSwitcher",
            "Clipboard",
            "ColorPicker",
            "DevicePresence",
            "DropShelf",
            "FocusSession",
            "Infinity",
            "Media",
            "Power",
            "PrivacyControls",
            "RemovableDevices",
            "ScreenCapture",
            "Stopwatch",
            "SystemMonitor",
            "Timer",
            "VoiceNotes"
          )

          foreach ($module in $requiredModules) {
            $modulePath = "artifacts/release/Modules/$module.glance"

            if (-not (Test-Path -LiteralPath $modulePath -PathType Leaf)) {
              throw "Managed publish did not include Modules/$module.glance"
            }
          }

          $flattenedModules = @(
            foreach ($module in $requiredModules) {
              Get-ChildItem "artifacts/release" -File | Where-Object { $_.Name -match "^Glance\.$module\.WinUI\.(dll|pri)$" }
            }
          )

          if ($flattenedModules.Count -gt 0) {
            throw "Module files were left in the application root: $($flattenedModules.Name -join ', ')"
          }

          $expandedModules = @(Get-ChildItem "artifacts/release/Modules" -Directory)

          if ($expandedModules.Count -gt 0) {
            throw "Expanded module directories were left in the release: $($expandedModules.Name -join ', ')"
          }
